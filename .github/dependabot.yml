version: 2

# CI detects dependency problems: pip-audit for published CVEs, and gitleaks
# for secrets. This file is the remediation half. Without it, remediation is
# manual and packages drift behind.
updates:
  # Use `uv`, not `pip`. The resolved versions live in uv.lock, and
  # `make lock-check` fails CI whenever the lock and pyproject disagree. Only
  # the uv ecosystem updates both together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Update within the declared constraints. Never rewrite a constraint. The
    # ceilings in pyproject are policy. `sagemaker>=2.220,<3` holds v2 until the
    # pipeline moves to the v3 API. `cdk-nag==3.0.1` is exact, because a bump
    # changes which findings fire, and therefore which acknowledgements in
    # infra/security_checks.py still bind. Raise either one on its own branch.
    versioning-strategy: "lockfile-only"
    # Group the updates, so a red run is attributable. Ungrouped, a week of
    # transitive churn is 20 PRs. In one all-in group, a synth failure can come
    # from any package. Groups match in order, so the catch-all stays last.
    groups:
      # aws-cdk-lib, constructs, and jsii are version-coupled. A partial bump
      # fails synthesis. cdk-nag joins them, because it is the gate that reads
      # the synthesized tree.
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "constructs"
          - "cdk-nag"
          - "jsii"
      # Keep these apart from aws-cdk. They change what the pipeline and the
      # evaluation image compute, so a regression here is a model-behaviour
      # regression, not a build break.
      pipeline-runtime:
        patterns:
          - "sagemaker"
          - "sagemaker-core"
          - "pandas"
          - "scikit-learn"
          - "matplotlib"
          - "xgboost"
      # The stubs must track the SDK they describe. Otherwise `make typecheck`
      # fails on signatures that no longer exist.
      boto3:
        patterns:
          - "boto3*"
          - "botocore"
          - "s3transfer"
          - "mypy-boto3-*"
      # Gate tooling. A bump here adds lint rules or type errors and turns CI
      # red on untouched code, so it takes its own PR.
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pip-audit"
          - "types-*"
      transitive:
        patterns:
          - "*"

  # Every action is SHA-pinned with a version comment. Dependabot updates the
  # SHA and the comment together. The interval is monthly, because these move
  # more slowly than the Python tree.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

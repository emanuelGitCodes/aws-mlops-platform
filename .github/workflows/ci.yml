name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: make install

      # Call the Make targets, so CI and a local run cannot drift apart. The
      # unit-test target carries a coverage floor that this file does not know.
      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Unit tests
        run: make test

      # AGENTS.md is the single source, and CLAUDE.md is a symlink to it.
      # Prose alone cannot stop a commit that replaces the symlink with a copy.
      - name: Check the agent docs stay one file
        run: make docs-sync

      # The wiki is a maintained deliverable with its own health check.
      # Without this step, a broken source link or an orphaned page merges.
      - name: Lint the wiki
        run: make wiki-lint

      - name: Audit Python dependencies
        run: make audit

      - name: CDK security synthesis
        # Both environments. A dev-only synth cannot catch an acknowledgement
        # whose construct path or finding id embeds the environment name.
        run: make synth-all

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

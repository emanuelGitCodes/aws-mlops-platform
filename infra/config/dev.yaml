env_name: dev
# Keep this physical group name stable. Use a distinct name in every other environment.
model_package_group: churn-model-group
# Auto-approve challengers in dev.
model_approval_status: Approved
endpoint_name: churn-serverless-dev
pipeline_name: churn-training-pipeline-dev
serverless:
  memory_mb: 2048
  max_concurrency: 5
monitor:
  # Run drift evaluation each hour.
  schedule_cron: "cron(0 * ? * * *)"
  # Page after this many hours with no endpoint invocations.
  # Dev has no minimum traffic level. Idle time can start this alarm.
  silence_alarm_hours: 24
budget_usd: 20
log_retention_days: 14
# Expire captured predictions after this many days.
# No other artifact prefix uses expiration.
capture_retention_days: 30
security:
  audit_log_retention_days: 90
  budget_thresholds: [50, 80, 100]
  # Dev owns the account-wide budget. Prod must keep this flag false.
  account_budget: true
  services:
    access_analyzer: true
    # Enabling GuardDuty starts a 30-day free trial, then bills monthly.
    guardduty: false
    config_recorder: true
    security_hub: false
    account_bpa: true
    eventbridge_alerts: true
cicd:
  github_repository: emanuelGitCodes/aws-mlops-platform
  # Dev owns the account-wide OIDC provider. Prod must keep this flag false.
  owns_oidc_provider: true
website:
  enabled: true
  # A Reserved Instance covers this type. Match the reservation before a change.
  instance_type: t4g.small
  rate_limit_per_minute: 10
  # Read this value for the deploy region with:
  #   aws ec2 describe-managed-prefix-lists --region <region> \
  #     --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
  # This value is for us-east-1. Another region uses another id.
  cloudfront_prefix_list_id: pl-3b927c52

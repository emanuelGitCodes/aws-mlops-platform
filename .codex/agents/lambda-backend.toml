name = "lambda-backend"
description = "Serverless Python specialist for ingestion, inference, deployment, drift and retrain handlers, and shared runtime contracts."
developer_instructions = """
Read `AGENTS.md` and `.codex/agent-contract.md` first.
Follow the assigned scope and the shared handoff format.

You own `src/ingestion/`, `src/serving/`, `src/monitoring/`, and the runtime
contracts `schema.py`, `events.py`, and `signing.py` in `src/common/`.
Coordinate `registry.py` with `ml-pipeline`; coordinate grants with `cdk-infra`.

## Domain checks

- Trace input validation, authorization, state transitions, and all side effects.
  Distinguish inference records from training records that require labels.
- Use `CustomerRecord`, shared encoding, and `log_event`. Preserve the request,
  response, event, and error contracts across producer and consumer.
- Design for duplicate, delayed, out-of-order, and concurrent events.
  A read-then-start cooldown is not an atomic lock. Use stable idempotency keys
  when retries can repeat a side effect.
- Inspect partial service responses, including EventBridge failed entries and
  SQS batch failures. A successful HTTP response can contain failed work.
- Bound retries, pagination, memory, payload size, and timeouts. Preserve poison
  message diagnosis and a recovery route after retries are exhausted.
- Handle model cold starts and unavailable responses explicitly. Preserve SigV4
  body integrity and avoid returning internal exception details.
- Keep capture failures visible without breaking successful inference.
  Distinguish handled application errors from Lambda exception metrics.
- Resolve the serving model separately from the latest approved package.
  Endpoint update acceptance does not prove readiness or successful promotion.
- Tie capture and monitoring references to model versions when the task changes
  lineage. Coordinate baseline and champion semantics with `ml-pipeline`.
- Inspect client creation and packaging for the deployed Lambda runtime.
  An import in a unit test MUST NOT create an unstubbed AWS client.

## Verification

Run `make check`. Use shared sample fixtures for boundary and failure tests.
Prove retries do not duplicate effects and failed responses cannot report
success. Report any required CDK grants and compatible deployment order.
Do not infer AWS permission correctness from mocked clients.
"""

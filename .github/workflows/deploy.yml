name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: Deploy production after the dev smoke test
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Use OIDC federation. Do not store long-lived AWS keys.
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"

      # Install the locked extras through the Make target.
      - name: Install locked dependencies
        run: make install

      - name: Assume dev role via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Use the CDK CLI version pinned by the Makefile.
      - name: Deploy
        run: make deploy ENV=dev
        env:
          SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
      - name: Smoke test the deployed API
        run: make smoke ENV=dev

  deploy-prod:
    needs: deploy-dev
    if: ${{ inputs.deploy_prod }}
    runs-on: ubuntu-latest
    # The GitHub environment scopes the OIDC subject claim.
    environment: prod
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"

      # Install the locked extras through the Make target.
      - name: Install locked dependencies
        run: make install

      - name: Assume prod role via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy
        run: make deploy ENV=prod
        env:
          SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
      - name: Smoke test the deployed API
        run: make smoke ENV=prod

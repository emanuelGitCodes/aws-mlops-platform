name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: make install

      # Via the Make targets, so CI and a local run can never drift apart --
      # the unit-test step in particular carries a coverage floor that only
      # the target knows about.
      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Unit tests
        run: make test

      # The wiki is a maintained deliverable with its own health check, and
      # `make wiki-lint` ran nowhere: a broken source link or an orphaned page
      # could merge unnoticed.
      - name: Lint the wiki
        run: make wiki-lint

      - name: Audit Python dependencies
        run: make audit

      - name: CDK security synthesis
        # Both environments: a dev-only synth cannot catch an acknowledgement
        # whose construct path or finding id embeds the environment name.
        run: make synth-all

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

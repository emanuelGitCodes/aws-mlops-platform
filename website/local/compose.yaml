# Local backing services for the website rebuild.
#
# These containers stand in for two AWS services during development. They never
# deploy. The deployed backend sets no endpoint variable and reaches the real
# DynamoDB and S3 services.
#
# Start:  docker compose -f local/compose.yaml up -d
# Reset:  docker compose -f local/compose.yaml down -v
#
# The `-v` flag is what deletes the data. A plain `down` keeps both volumes.
#
# Open http://localhost:5173 for the site. The Vite dev server proxies `/api`
# to the backend container, so the browser sends same-origin requests and the
# backend needs no CORS configuration.
#
# `PREDICT_URL` is empty by default, so `/api/predict` answers 502. Point it at
# the deployed API and give the backend real credentials to try a prediction:
#   PREDICT_URL=https://<id>.execute-api.<region>.amazonaws.com/dev/predict \
#     docker compose -f local/compose.yaml up -d

name: mlops-website-local

services:
  # The React and TypeScript frontend, with hot reload.
  frontend:
    build:
      context: ../frontend
      # `runtime` builds the static bundle for a deployed server instead.
      target: dev
    depends_on:
      - backend
    environment:
      # Vite reads this and proxies `/api` there. The browser never sees it.
      BACKEND_ORIGIN: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      # Mount the source for hot reload, and keep the image's `node_modules`.
      - ../frontend:/app
      - /app/node_modules

  # The FastAPI backend. Its OpenAPI page is at http://localhost:8080/api/docs.
  backend:
    build:
      # The context is the repository root, because the image needs both
      # `website/backend/` and `src/common/`, and no one directory holds both.
      # The root `.dockerignore` keeps that context small.
      context: ../..
      dockerfile: website/backend/Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      # botocore reads these two and reaches the containers below. The deployed
      # backend sets neither and reaches the real AWS services.
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      # botocore ignores `AWS_REGION`. This is the name it reads.
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: localdev
      AWS_SECRET_ACCESS_KEY: localdev123
      TABLE_NAME: mlops-website-mailing-list
      ARTIFACTS_BUCKET: mlops-artifacts
      EVALUATION_PREFIX: evaluations
      RATE_LIMIT_PER_MINUTE: "10"
      PORT: "8080"
      # Signing a real prediction needs a real API and real credentials.
      PREDICT_URL: "${PREDICT_URL:-}"
    ports:
      - "8080:8080"
    develop:
      watch:
        # `docker compose up --watch` reloads the image on a source change.
        - action: rebuild
          path: ../backend
        - action: rebuild
          path: ../../src/common

  # DynamoDB Local holds the mailing list.
  dynamodb:
    image: amazon/dynamodb-local:latest
    # `-sharedDb` keeps one database for every credential. Without it the
    # emulator keys each table to the caller's access key, and a table created
    # by one identity raises ResourceNotFoundException for another.
    # `-dbPath` writes to the volume. The default is memory only.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    # The image runs as `dynamodblocal`, which cannot write a fresh named
    # volume. Root owns the write, and the data outlives the container.
    user: root
    volumes:
      - dynamodb-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      # The emulator ships no shell utility for a request, so this checks that
      # the port accepts a connection.
      test: ["CMD-SHELL", "java -version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO answers the S3 API and holds the evaluation reports.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: localdev123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      # The browser console. Sign in with the two values above.
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the bucket and the table, then exit. Compose reruns this on every
  # `up`, so each step tolerates an object that already exists.
  bootstrap:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: localdev
      AWS_SECRET_ACCESS_KEY: localdev123
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        aws --endpoint-url http://minio:9000 s3api create-bucket \
          --bucket mlops-artifacts 2>/dev/null || true
        aws --endpoint-url http://dynamodb:8000 dynamodb create-table \
          --table-name mlops-website-mailing-list \
          --attribute-definitions AttributeName=email,AttributeType=S \
          --key-schema AttributeName=email,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST >/dev/null 2>&1 || true
        echo "bucket mlops-artifacts and table mlops-website-mailing-list are ready"

volumes:
  dynamodb-data:
  minio-data:

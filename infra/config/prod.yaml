env_name: prod
# Must differ from every other environment's group. Stacks are environment-
# agnostic (no `env=cdk.Environment`), so dev and prod land in the same
# account: a shared name means the second RegistryStack cannot create the
# group, and both ServingStacks' approval rules match the same events — a
# dev-auto-approved challenger would deploy itself to the prod endpoint.
# Dev keeps the unsuffixed name because it already holds deployed lineage.
model_package_group: churn-model-group-prod
model_approval_status: PendingManualApproval
endpoint_name: churn-serverless-prod
pipeline_name: churn-training-pipeline-prod
serverless:
  memory_mb: 3072
  max_concurrency: 20
monitor:
  # Hourly, matching dev. Reviewed 2026-08-01 and kept deliberately. Note each
  # run is a SageMaker processing job on ml.m5.large, so a live hourly schedule
  # is ~720 jobs/month and would dominate the bill below.
  schedule_cron: "cron(0 * ? * * *)"

# The three values below match dev deliberately -- reviewed 2026-08-01, not an
# untuned copy. The budget in particular is account-wide: CfnBudget is created
# with no CostFilters, so this does not scope prod's spend, it re-measures the
# whole account. Once prod is deployed, both environments' budgets alarm on the
# same dollars at 50/80/100%.
budget_usd: 20
log_retention_days: 14
security:
  audit_log_retention_days: 90
  budget_thresholds: [50, 80, 100]
  services:            # stays all-false until the manual production rollout
    access_analyzer: false
    guardduty: false
    config_recorder: false
    security_hub: false
    account_bpa: false
    eventbridge_alerts: false

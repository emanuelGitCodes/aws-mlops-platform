[project]
name = "aws-mlops-platform"
version = "0.1.0"
description = "Portfolio-grade MLOps reference platform on AWS: SageMaker Pipelines, serverless inference, and a drift->retrain loop, all in CDK."
authors = [{ name = "Emanuel J. Cortes-Lugo" }]
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.150,<3",
    "constructs>=10,<11",
    "pydantic>=2,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5,<8",
    "ruff>=0.5",
    "boto3>=1.34",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.7,<4",
    "cdk-nag==3.0.1",
    "pip-audit>=2.10,<3",
    "mypy>=2,<3",
    "boto3-stubs[cloudformation,s3,sagemaker,sagemaker-runtime]>=1.34",
    "types-PyYAML>=6",
    # The backend runs from its own image. These two are here because
    # `tests/unit/test_backend_app.py` imports FastAPI, and its TestClient
    # needs httpx.
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]
pipeline = [
    "sagemaker>=2.220,<3",
    "pandas>=2",
    "scikit-learn>=1.4",
    "matplotlib>=3.7,<4",
    "pytz>=2021.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ANN"]
# Allow `**kwargs: Any` for CDK and jsii passthrough.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Do not enforce function annotations under `tests/`.
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
files = ["src", "website/backend", "infra", "scripts"]
# Treat `scripts/` as an explicit package base for mypy module resolution.
mypy_path = "."
explicit_package_bases = true
# Exclude synthesized CDK assets and vendored Lambda packages.
exclude = "^infra/cdk\\.out/"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# Ignore missing stubs for SageMaker processing runtime dependencies.
[[tool.mypy.overrides]]
module = ["sagemaker.*", "sklearn.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
# Treat deprecations as errors across the dependency tree.
# Put narrow exceptions after the error rules. Name the condition that removes each exception.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # `TrainingStep` uses `estimator=`. Delete this exception with that call site.
    "default:We are deprecating the instantiation of TrainingStep:DeprecationWarning",
]

# The `test` Make target applies unit-test measurement flags.
[tool.coverage.run]
source = ["src", "website/backend", "infra", "scripts"]
omit = [
    # Exclude synthesized CDK assets and vendored Lambda packages.
    "infra/cdk.out/*",
]

[tool.coverage.report]
show_missing = true
# Report two decimal places for the measured total.
precision = 2
# Raise `fail_under` after an increase. Do not lower it for a failing run.
# Round the new floor down from the printed total.
# The check compares `fail_under` against the unrounded value.
fail_under = 94.74

name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federation; no long-lived AWS keys anywhere
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"

      # Via the Make target, like every other workflow: the extras this
      # project needs are defined once, in `install`, not restated here.
      - name: Install locked dependencies
        run: make install

      - name: Assume dev role via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Via the Make target: the CDK CLI version is pinned once, in the
      # Makefile, rather than restated in every workflow that deploys.
      - name: Deploy
        run: make deploy ENV=dev
      - name: Smoke test the deployed API
        run: make smoke ENV=dev

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod   # manual approval gate configured on the GitHub environment
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"

      # Via the Make target, like every other workflow: the extras this
      # project needs are defined once, in `install`, not restated here.
      - name: Install locked dependencies
        run: make install

      - name: Assume prod role via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy
        run: make deploy ENV=prod
      - name: Smoke test the deployed API
        run: make smoke ENV=prod

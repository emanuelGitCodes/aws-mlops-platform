env_name: dev
# Unsuffixed, because this group already holds deployed model lineage. A rename
# replaces the group. Every other environment must pick a distinct name. See
# the note in prod.yaml.
model_package_group: churn-model-group
model_approval_status: Approved   # auto-approve challengers in dev
endpoint_name: churn-serverless-dev
pipeline_name: churn-training-pipeline-dev
serverless:
  memory_mb: 2048
  max_concurrency: 5
monitor:
  schedule_cron: "cron(0 * ? * * *)"   # hourly
budget_usd: 20
log_retention_days: 14
security:
  audit_log_retention_days: 90
  budget_thresholds: [50, 80, 100]
  # Dev owns the account-wide budget. It holds the deployed $20 budget and its
  # notification history. The budget is account-scoped, so it covers prod spend
  # too. Prod must stay false. See the note there.
  account_budget: true
  services:            # Phase 3 enablement flags. One flips true per sub-phase.
    access_analyzer: true
    guardduty: false   # 3B deferred. The AWS Free plan blocks GuardDuty.
    config_recorder: true    # 3C. Enabled 2026-08-02. Minimally scoped.
    security_hub: false
    account_bpa: true
    eventbridge_alerts: false

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federation; no long-lived AWS keys anywhere
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
          npm install -g aws-cdk
      - name: Assume dev role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy
        run: cd infra && cdk deploy --all -c env=dev --require-approval never
      - name: Smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name Mlops-Dev-Serving \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API: $URL"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod   # manual approval gate configured on the GitHub environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
          npm install -g aws-cdk
      - name: Assume prod role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy
        run: cd infra && cdk deploy --all -c env=prod --require-approval never

env_name: prod
# This must differ from every other environment's group. The stacks are
# environment-agnostic, so dev and prod land in the same account. Under a
# shared name, the second RegistryStack cannot create the group, and both
# ServingStack approval rules match the same events, so a dev-auto-approved
# challenger deploys itself to the prod endpoint. Dev keeps the unsuffixed
# name, because it already holds deployed lineage.
model_package_group: churn-model-group-prod
model_approval_status: PendingManualApproval
endpoint_name: churn-serverless-prod
pipeline_name: churn-training-pipeline-prod
serverless:
  memory_mb: 3072
  max_concurrency: 20
monitor:
  # Each run is a SageMaker processing job on ml.m5.large, so an hourly
  # schedule is about 720 jobs a month and dominates the budget below.
  schedule_cron: "cron(0 * ? * * *)"
  # Hours of zero endpoint invocations before the silence alarm pages. The
  # value is only meaningful where traffic is expected, so it is tighter than
  # dev's.
  silence_alarm_hours: 6

# `budget_usd` is inert while `security.account_budget` is false. Keep it set,
# so the number is ready if budget ownership moves here.
budget_usd: 20
log_retention_days: 14
# Days a captured prediction survives under the `capture/` prefix. The drift
# job reads one hour, so this only bounds how far back a past violation can be
# investigated. Nothing else in the artifacts bucket expires.
capture_retention_days: 30
security:
  audit_log_retention_days: 90
  budget_thresholds: [50, 80, 100]
  # This must stay false while dev is true. AWS Budgets is account-scoped, and
  # these stacks are environment-agnostic. A second budget does not scope prod
  # spend. It measures the whole account and alarms on the same dollars at 50,
  # 80, and 100 percent. The dev budget already covers prod.
  account_budget: false
  services:
    access_analyzer: false
    guardduty: false
    config_recorder: false
    security_hub: false
    account_bpa: false
    eventbridge_alerts: false
